<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-6">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Navigatie -->
    <nav class="flex gap-4 border-b pb-4 text-sm font-medium">
      <a href="index.html" class="text-blue-600 border-b-2 border-blue-600 pb-1">AI Chat</a>
      <a href="kennisbank.html" class="text-gray-500 hover:text-gray-800">Kennisbank Structuur</a>

      <a href="klanten.html" class="text-gray-500 hover:text-gray-800">ABCDE Klanten</a>

    <!-- Chat Card -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <h1 class="text-xl font-bold text-gray-900 mb-4">AI Assistant</h1>
      
      <div class="space-y-4">
        <textarea rows="3" placeholder="Stel een vraag aan de AI assistant..." class="w-full p-3 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"></textarea>
        
        <button class="bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-700">Verstuur</button>

        <!-- Privacy Disclaimer -->
        <div class="flex items-center gap-2 text-xs text-gray-500 pt-2 border-t border-gray-100">
          <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m0 0v2m0-2h2m-2 0H10m11 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>🔒 <strong>Privacy:</strong> Deel a.u.b. geen persoonlijke of privacygevoelige informatie in deze chat.</span>

    </div>
