<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kennisbank</title>
  <!-- Google Fonts & FontAwesome Icons (Optioneel) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-color: #0f766e; /* Strakke moderne groen/teal tint */
      --primary-hover: #0d9488;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 15px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Header & User Nav */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .user-info {
      color: var(--text-muted);
      margin-right: 12px;
    }

    .btn-logout {
      color: var(--primary-color);
      font-weight: 600;
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--primary-color);
      border-radius: 6px;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background-color: var(--primary-color);
      color: white;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    /* Filter & Zoeksectie */
    .filter-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    .search-box {
      position: relative;
      margin-bottom: 15px;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-box input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary-color);
    }

    .dropdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: white;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    /* Checkbox / Toon velden opties */
    .checkbox-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .checkbox-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      accent-color: var(--primary-color);
    }

    /* Resultaten header */
    .results-count {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      font-weight: 500;
    }

    /* Kennisbank Kaarten */
    .article-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .article-card {
      background: var(--card-bg);
      padding: 18px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .article-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      border-color: var(--primary-hover);
    }

    .article-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .article-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .badge {
      background-color: #e0f2fe;
      color: #0369a1;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .article-meta {
      display: flex;
      gap: 15px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .article-meta span {
      display: flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Navigatie -->
    <div class="top-bar">
      <span class="user-info">Tim Meeuwsen</span>
      <a href="#" class="btn-logout">Uitloggen</a>
    </div>

    <h1>Kennisbank</h1>

    <!-- Filter Kaart -->
    <div class="filter-card">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Zoeken in kennisbank...">
      </div>

      <div class="dropdown-grid">
        <select>
          <option value="">Alle categorieën</option>
          <option value="automatisering">Automatisering</option>
          <option value="proces">Proces</option>
          <option value="security">Security</option>
          <option value="workflow">Workflow</option>
        </select>

        <select>
          <option value="">Alle personen</option>
        </select>

        <select>
          <option value="nieuwste">Nieuwste eerst</option>
          <option value="oudste">Oudste eerst</option>
        </select>
      </div>

      <div class="checkbox-title">Zichtbare kolommen / details</div>
      <div class="checkbox-group">
        <label><input type="checkbox" checked> Datum/tijd</label>
        <label><input type="checkbox"> Categorie</label>
        <label><input type="checkbox"> Persoon</label>
        <label><input type="checkbox"> Beschrijving</label>
        <label><input type="checkbox"> Tags</label>
        <label><input type="checkbox"> Bestand</label>
      </div>
    </div>

    <!-- Resultaten teller -->
    <div class="results-count">35 resultaten gevonden</div>

    <!-- Lijst van resultaten (Cards) -->
    <div class="article-list">

      <a href="#" class="article-card">
        <div class="article-header">
          <div class="article-title">TeamworkPM SQL inzichtpagina</div>
          <span class="badge">Automatisering</span>
        </div>
        <div class="article-meta">
          <span><i class="fa-regular fa-calendar"></i> 2026-08-04</span>
          <span><i class="fa-regular fa-user"></i> Tim Meeuwsen</span>
        </div>
      </a>

      <a href="#" class="article-card">
        <div class="article-header">
          <div class="article-title">Projecten uit TeamworkPM</div>
          <span class="badge">Workflow</span>
        </div>
        <div class="article-meta">
          <span><i class="fa-regular fa-calendar"></i> 2026-08-03</span>
        </div>
      </a>

      <a href="#" class="article-card">
        <div class="article-header">
          <div class="article-title">Klanten uit TeamworkPM</div>
          <span class="badge">Proces</span>
        </div>
        <div class="article-meta">
          <span><i class="fa-regular fa-calendar"></i> 2026-08-03</span>
        </div>
      </a>

    </div>

  </div>

</body>
</html>
