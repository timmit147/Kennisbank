<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hosting Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Navigatie -->
    <nav class="flex gap-4 border-b pb-4 text-sm font-medium">
      <a href="index.html" class="text-gray-500 hover:text-gray-800">AI Chat</a>
      <a href="kennisbank.html" class="text-gray-500 hover:text-gray-800">Kennisbank Structuur</a>
      <a href="dashboard.html" class="text-blue-600 border-b-2 border-blue-600 pb-1">Hosting Dashboard</a>
      <a href="klanten.html" class="text-gray-500 hover:text-gray-800">ABCDE Klanten</a>
    </nav>

    <h1 class="text-2xl font-bold text-gray-900">Hosting Performance Dashboard</h1>

    <!-- KPI Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500 uppercase font-semibold">Totaal Sites</p>
        <p class="text-2xl font-bold text-gray-900">542</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500 uppercase font-semibold">Actief / Inactief</p>
        <p class="text-2xl font-bold text-green-600">501 <span class="text-xs font-normal text-gray-400">/ 41</span></p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500 uppercase font-semibold">Totale Opslag</p>
        <p class="text-2xl font-bold text-blue-600">1.5 TB</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500 uppercase font-semibold">Dataverkeer</p>
        <p class="text-2xl font-bold text-indigo-600">2.8 TB/m</p>
      </div>
    </div>

    <!-- Serververdeling -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-800 mb-3">Serververdeling</h2>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between"><span>Rory</span> <span class="font-semibold">189 sites</span></div>
        <div class="flex justify-between"><span>Cloudways</span> <span class="font-semibold">151 sites</span></div>
        <div class="flex justify-between"><span>Clara</span> <span class="font-semibold">133 sites</span></div>
        <div class="flex justify-between"><span>Kinsta</span> <span class="font-semibold">43 sites</span></div>
        <div class="flex justify-between"><span>Ploi</span> <span class="font-semibold">26 sites</span></div>
      </div>
    </div>

  </div>
</body>
</html>
